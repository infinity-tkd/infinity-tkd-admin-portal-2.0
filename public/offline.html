<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Offline | Infinity TKD</title>
<!-- Served by the service worker when a page cannot load. Static on purpose: it needs no script, session or data. -->
<style>
  :root { --bg: #f7f7f7; --surface: #ffffff; --line: #e5e5e5; --ink: #171717; --muted: #525252; --brand: #ef2f38; --brand-strong: #d71f28; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0a0a; --surface: #141414; --line: #262626; --ink: #f5f5f5; --muted: #a3a3a3; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Khmer", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  main { width: 100%; max-width: 420px; padding: 32px 24px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px rgb(0 0 0 / 0.08); }
  .icon { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 50%; color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, transparent); }
  h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); font-size: 0.9375rem; }
  a.retry { display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 24px; border-radius: 8px; background: var(--brand); color: #fff; font-weight: 700; text-decoration: none; touch-action: manipulation; }
  a.retry:hover { background: var(--brand-strong); }
  a.retry:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  .brand { margin-top: 20px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M8.5 16.4a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.1-1.6"/><path d="M2 8.8a15 15 0 0 1 4.2-2.6"/><path d="M22 8.8A15 15 0 0 0 11 4.9"/><path d="M12 20h.01"/></svg>
  </div>
  <h1>You're offline</h1>
  <p>This page needs an internet connection. Reconnect, then try again. Attendance you marked in the portal while offline stays on this device and is sent automatically.</p>
  <a class="retry" href="">Try again</a>
  <div class="brand">Infinity TKD</div>
</main>
</body>
</html>
